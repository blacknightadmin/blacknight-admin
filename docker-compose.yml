services:
  db:
    image: postgres:16
    restart: always
    environment: 
      POSTGRES_PASSWORD: example!
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  admin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: changethis!
    ports:
      - 8080:80
    volumes:
      - admin-data:/var/lib/pgadmin
  redis:
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment: 
      REDIS_ARGS: --appendonly yes
volumes:
  db-data:
  admin-data:
  redis-data:
    driver: local